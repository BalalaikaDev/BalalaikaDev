name: Update now.svg

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # manual run button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate now.svg from GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_now.py now.svg
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- now.svg; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add now.svg
            git commit -m "chore: refresh now.svg [skip ci]"
            git push
          else
            echo "now.svg unchanged — nothing to commit"
          fi
